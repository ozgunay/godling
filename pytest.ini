[pytest]
# The mind's and the tools' tests (the site's run with `manage.py test`, the world's and the renderer's with their
# own runners: TESTING.md).
testpaths = mind/tests tools/tests
pythonpath = mind tools
markers =
    integration: runs a real Clawblox world (skipped unless clawblox is on PATH or GODLING_CLAWBLOX is set)
