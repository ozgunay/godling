# Godling on one server (the user's choice, as AgentOp runs): Postgres, Redis, the site and its worker, the island
# (world, mind, panel) and Caddy in front. Copy .env.example to .env, fill it in, then: docker compose up -d --build.
# See deploy/README.md.
name: godling

# What the site and its worker both need.
x-site-env: &site-env
  GODLING_DEBUG: "0"
  GODLING_SECRET_KEY: ${GODLING_SECRET_KEY:?set GODLING_SECRET_KEY in .env}
  GODLING_HOSTS: ${GODLING_DOMAIN:?set GODLING_DOMAIN in .env}
  GODLING_TRUSTED_ORIGINS: https://${GODLING_DOMAIN}
  GODLING_TRUSTED_PROXIES: "1"  # Caddy: allauth's rate limits read the viewer's address it forwards
  GODLING_DB_HOST: postgres
  GODLING_DB_PASSWORD: ${GODLING_DB_PASSWORD}
  GODLING_REDIS_URL: redis://redis:6379/0  # the shared cache, and the worker's queue
  GODLING_PANEL_URL: http://island:8081
  GODLING_PANEL_KEY: ${GODLING_PANEL_KEY:?set GODLING_PANEL_KEY in .env}
  # The island on its own origin (ADR-014). No slash after /island: the world serves its page there exactly.
  # No token in the island's public link: Caddy and the relay hold it (ADR-015).
  GODLING_VIEW_URL: https://${GODLING_ISLAND_DOMAIN:?set GODLING_ISLAND_DOMAIN in .env}/island
  GODLING_RUN_DIR: /runs/live
  # Where browsers fetch replay chunks (ADR-016): the island's origin, where Caddy serves them from their volume.
  # With a bucket set on the island, the index names the bucket's address instead.
  GODLING_REPLAY_URL: https://${GODLING_ISLAND_DOMAIN}/replay
  GODLING_STRIPE_SECRET_KEY: ${GODLING_STRIPE_SECRET_KEY:-}
  GODLING_STRIPE_WEBHOOK_SECRET: ${GODLING_STRIPE_WEBHOOK_SECRET:-}
  GODLING_FROM_EMAIL: ${GODLING_FROM_EMAIL:-Godling <noreply@localhost>}
  GODLING_EMAIL_HOST: ${GODLING_EMAIL_HOST:-}
  GODLING_EMAIL_PORT: ${GODLING_EMAIL_PORT:-587}
  GODLING_EMAIL_USER: ${GODLING_EMAIL_USER:-}
  GODLING_EMAIL_PASSWORD: ${GODLING_EMAIL_PASSWORD:-}
  GODLING_EMAIL_TLS: ${GODLING_EMAIL_TLS:-1}
  GODLING_EMAIL_SSL: ${GODLING_EMAIL_SSL:-0}
  GODLING_SECURITY_REVIEW: ${GODLING_SECURITY_REVIEW:-}  # live Stripe keys wait for it (ADR-017)
  GODLING_TURNSTILE_SITE_KEY: ${GODLING_TURNSTILE_SITE_KEY:-}
  GODLING_TURNSTILE_SECRET_KEY: ${GODLING_TURNSTILE_SECRET_KEY:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: godling
      POSTGRES_USER: godling
      POSTGRES_PASSWORD: ${GODLING_DB_PASSWORD:?set GODLING_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U godling -d godling"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The shared cache (rate limits, the island's news, who is watching) and the worker's queue. Nothing in it
  # outlives a restart that matters: a queued power not taken in 3 minutes is given up and its credits come back.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb",
              "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  site:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.site
    restart: unless-stopped
    environment: *site-env
    volumes:
      - runs:/runs:ro  # the admin's log viewer reads the island's logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Takes powers to the island, one at a time as the island takes them (apps.screen.tasks), so no web request waits.
  # Its clock (--beat; one worker, so one clock) gives up every minute the powers nobody will take, credits back.
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.site
    restart: unless-stopped
    command: ["celery", "-A", "godling_web", "worker", "--beat", "--schedule", "/tmp/celerybeat-schedule",
              "--concurrency", "1", "--loglevel", "info"]
    environment: *site-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  island:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.island
    restart: unless-stopped
    stop_grace_period: 30s  # the island is saved first, then Godling's memory is written
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY in .env}
      WORLD_BASE_PATH: /island
      WORLD_SPECTATOR_TOKEN: ${GODLING_SPECTATOR_TOKEN:?set GODLING_SPECTATOR_TOKEN in .env}
      # Reachable by Caddy and the relay inside Compose's network. The world then insists on a join key, which the launcher makes
      # for every start (patches/v2, ADR-014); Caddy passes only the watching side on.
      WORLD_HOST: 0.0.0.0
      GODLING_PANEL_HOST: 0.0.0.0
      GODLING_PANEL_KEY: ${GODLING_PANEL_KEY}
      GODLING_RUN_DIR: /runs/live
      GODLING_MIND_ARGS: ${GODLING_MIND_ARGS:-}
      # Replays (ADR-016): raw recordings kept this many days; and, to keep the packed chunks in object storage too,
      # an S3-compatible bucket (Cloudflare R2, Hetzner, Amazon S3). Empty bucket: chunks stay in the runs volume.
      GODLING_REPLAY_RAW_DAYS: ${GODLING_REPLAY_RAW_DAYS:-3}
      GODLING_REPLAY_BUCKET: ${GODLING_REPLAY_BUCKET:-}
      GODLING_REPLAY_ENDPOINT: ${GODLING_REPLAY_ENDPOINT:-}
      GODLING_REPLAY_KEY_ID: ${GODLING_REPLAY_KEY_ID:-}
      GODLING_REPLAY_SECRET: ${GODLING_REPLAY_SECRET:-}
      GODLING_REPLAY_PUBLIC_URL: ${GODLING_REPLAY_PUBLIC_URL:-}
      GODLING_REPLAY_PREFIX: ${GODLING_REPLAY_PREFIX:-}
      GODLING_REPLAY_REGION: ${GODLING_REPLAY_REGION:-auto}
    volumes:
      - runs:/runs
      # Replay chunks (ADR-016) in a volume of their own, inside the run, so Caddy can serve them without the rest.
      - replay_chunks:/runs/live/replay/chunks

  # The island's stream relay (relay/, ADR-015), which Caddy sends every viewer's socket to: one connection to the
  # world, the same updates to everyone. In a container of its own, with the spectator token and nothing else: the
  # part of the island that the whole internet talks to is kept apart from Godling's keys. It takes sockets only from
  # the island's own page, at most RELAY_MAX_PER_IP per viewer address (read from Caddy's X-Forwarded-For).
  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.relay
    restart: unless-stopped
    environment:
      RELAY_LISTEN: 0.0.0.0:8082
      RELAY_UPSTREAM: ws://island:8080/island/spectate/ws
      RELAY_BASE_PATH: /island
      RELAY_SPECTATOR_TOKEN: ${GODLING_SPECTATOR_TOKEN:?set GODLING_SPECTATOR_TOKEN in .env}
      RELAY_ORIGINS: https://${GODLING_ISLAND_DOMAIN}
      RELAY_TRUSTED_PROXIES: "1"
    depends_on:
      - island

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      GODLING_DOMAIN: ${GODLING_DOMAIN}
      GODLING_ISLAND_DOMAIN: ${GODLING_ISLAND_DOMAIN}
      GODLING_SPECTATOR_TOKEN: ${GODLING_SPECTATOR_TOKEN}  # handed to the world on the page's own requests
      # Behind Cloudflare: its address ranges, whose CF-Connecting-IP is the viewer's address (ADR-017). Empty: no proxy
      # in front is believed.
      GODLING_PROXY_RANGES: ${GODLING_PROXY_RANGES:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - replay_chunks:/srv/replay-chunks:ro  # only the replay chunks (ADR-016): none of the run's keys, memory or logs
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - site
      - island
      - relay

  # Monitoring (ADR-017): Prometheus reads the relay, Caddy and the server; Alertmanager emails what alerts.yml finds
  # wrong, through the site's SMTP, to GODLING_ALERT_EMAIL. Their pages listen on the server's loopback only: reach
  # them through an SSH tunnel (deploy/README.md).
  prometheus:
    image: quay.io/prometheus/prometheus:v3.5.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus",
              "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  alertmanager:
    image: quay.io/prometheus/alertmanager:v0.28.1
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/alertmanager/start.sh"]  # its config from the environment
    environment:
      GODLING_ALERT_EMAIL: ${GODLING_ALERT_EMAIL:-}
      GODLING_FROM_EMAIL: ${GODLING_FROM_EMAIL:-Godling <noreply@localhost>}
      GODLING_EMAIL_HOST: ${GODLING_EMAIL_HOST:-}
      GODLING_EMAIL_PORT: ${GODLING_EMAIL_PORT:-587}
      GODLING_EMAIL_USER: ${GODLING_EMAIL_USER:-}
      GODLING_EMAIL_PASSWORD: ${GODLING_EMAIL_PASSWORD:-}
      GODLING_EMAIL_TLS: ${GODLING_EMAIL_TLS:-1}
      GODLING_EMAIL_SSL: ${GODLING_EMAIL_SSL:-0}
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"

  # The server itself (CPU, memory, disks), read through its root mounted read-only. Network totals are not taken
  # here: from a container they would be the container's own; the relay and Caddy count what goes to viewers.
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    restart: unless-stopped
    command: ["--path.rootfs=/host", "--no-collector.netdev", "--no-collector.netstat"]
    pid: host
    volumes:
      - /:/host:ro

volumes:
  pgdata:
  runs:
  replay_chunks:
  caddy_data:
  caddy_config:
  prometheus_data:
  alertmanager_data:
