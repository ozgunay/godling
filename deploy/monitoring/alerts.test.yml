# promtool test rules alerts.test.yml: each alert fires on what it is for, and only then.
rule_files:
  - alerts.yml

evaluation_interval: 15s

tests:
  - name: the relay down for a minute
    interval: 15s
    input_series:
      - series: 'up{job="relay", instance="island:8082"}'
        values: "1 1 0 0 0 0 0 0"
    alert_rule_test:
      - eval_time: 45s
        alertname: RelayDown
        exp_alerts: [] # down for 15 s: not yet
      - eval_time: 105s
        alertname: RelayDown
        exp_alerts:
          - exp_labels: {severity: critical, job: relay, instance: "island:8082"}
            exp_annotations:
              summary: The stream relay is not answering.
              description: Prometheus has not reached the relay (island:8082) for a minute. Viewers' islands are reconnecting.

  - name: the world down, then back before 3 minutes
    interval: 30s
    input_series:
      - series: 'godling_relay_world_up{job="relay", instance="island:8082"}'
        values: "1 0 0 0 0 1 1"
    alert_rule_test:
      - eval_time: 3m
        alertname: WorldStreamDown
        exp_alerts: []

  - name: the world down for good
    interval: 30s
    input_series:
      - series: 'godling_relay_world_up{job="relay", instance="island:8082"}'
        values: "1 0x10"
    alert_rule_test:
      - eval_time: 4m
        alertname: WorldStreamDown
        exp_alerts:
          - exp_labels: {severity: critical, job: relay, instance: "island:8082"}
            exp_annotations:
              summary: The relay has had no world to follow for 3 minutes.
              description: The world's spectator stream is down. Viewers see "Restarting". Look at the island's world.log.

  - name: a crowd near the cap
    interval: 1m
    input_series:
      - series: 'godling_relay_viewers{job="relay", instance="island:8082"}'
        values: "4200x10"
      - series: 'godling_relay_max_viewers{job="relay", instance="island:8082"}'
        values: "5000x10"
    alert_rule_test:
      - eval_time: 6m
        alertname: ViewersNearCap
        exp_alerts:
          - exp_labels: {severity: warning, job: relay, instance: "island:8082"}
            exp_annotations:
              summary: "Viewers at 84% of the relay's cap."
              description: Raise RELAY_MAX_VIEWERS if the server has room, or add a relay.

  - name: someone hammering the relay
    interval: 1m
    input_series:
      - series: 'godling_relay_refused_total{job="relay", instance="island:8082", reason="rate"}'
        values: "0+300x15" # 5 a second
      - series: 'godling_relay_refused_total{job="relay", instance="island:8082", reason="origin"}'
        values: "0+600x15" # other sites' pages: not counted here
    alert_rule_test:
      - eval_time: 12m
        alertname: ConnectionsRefused
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "The relay refuses 5 connections a second."
              description: Someone is hammering the relay (refusals by reason in godling_relay_refused_total), or the limits are too tight for a real crowd.

  - name: a quiet relay refuses now and then
    interval: 1m
    input_series:
      - series: 'godling_relay_refused_total{job="relay", instance="island:8082", reason="address"}'
        values: "0+6x15" # one every 10 s
    alert_rule_test:
      - eval_time: 12m
        alertname: ConnectionsRefused
        exp_alerts: []

  - name: the stream sending a lot
    interval: 1m
    input_series:
      - series: 'godling_relay_sent_bytes_total{job="relay", instance="island:8082"}'
        values: "0+1800000000x20" # 30 MB/s
    alert_rule_test:
      - eval_time: 16m
        alertname: PublicBandwidthHigh
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "Sending 28.61MiB/s to viewers."
              description: The stream and the site together are above 20 MB/s (160 Mbit/s) for 10 minutes.

  - name: the site failing
    interval: 1m
    input_series:
      - series: 'caddy_http_request_duration_seconds_count{job="caddy", code="200"}'
        values: "0+600x10"
      - series: 'caddy_http_request_duration_seconds_count{job="caddy", code="502"}'
        values: "0+120x10"
    alert_rule_test:
      - eval_time: 8m
        alertname: SiteErrors
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "16.67% of requests fail with a server error."
              description: The site or the island answers 5xx through Caddy. Look at docker compose logs site island.

  - name: the disk with the run filling, wherever it is mounted
    interval: 1m
    input_series:
      # One disk under two mount points, 5% free: one alert for the device.
      - series: 'node_filesystem_avail_bytes{job="node", device="/dev/sdb", fstype="ext4", mountpoint="/var/lib/docker"}'
        values: "10e9x20"
      - series: 'node_filesystem_size_bytes{job="node", device="/dev/sdb", fstype="ext4", mountpoint="/var/lib/docker"}'
        values: "200e9x20"
      - series: 'node_filesystem_avail_bytes{job="node", device="/dev/sdb", fstype="ext4", mountpoint="/mnt/data"}'
        values: "10e9x20"
      - series: 'node_filesystem_size_bytes{job="node", device="/dev/sdb", fstype="ext4", mountpoint="/mnt/data"}'
        values: "200e9x20"
      # A tiny bind mount that is always full, and the system disk with room: neither alerts.
      - series: 'node_filesystem_avail_bytes{job="node", device="/dev/sdc", fstype="ext4", mountpoint="/usr/lib/wsl"}'
        values: "0x20"
      - series: 'node_filesystem_size_bytes{job="node", device="/dev/sdc", fstype="ext4", mountpoint="/usr/lib/wsl"}'
        values: "50e6x20"
      - series: 'node_filesystem_avail_bytes{job="node", device="/dev/sda", fstype="ext4", mountpoint="/"}'
        values: "60e9x20"
      - series: 'node_filesystem_size_bytes{job="node", device="/dev/sda", fstype="ext4", mountpoint="/"}'
        values: "100e9x20"
    alert_rule_test:
      - eval_time: 16m
        alertname: DiskFilling
        exp_alerts:
          - exp_labels: {severity: critical, device: /dev/sdb}
            exp_annotations:
              summary: "The server's disk /dev/sdb is 5% free."
              description: The run's recordings and logs grow. Free space before the world and the database stop.

  - name: backups on time, off the server
    interval: 15m
    input_series:
      # Each job's last success keeps up with the clock: the database every 15 min here, the others now and then.
      - series: 'godling_backup_started_timestamp_seconds{job="node"}'
        values: "0x40"
      - series: 'godling_backup_last_success_timestamp_seconds{job="node", what="db"}'
        values: "0+900x40"
      - series: 'godling_backup_last_success_timestamp_seconds{job="node", what="run"}'
        values: "0+900x40"
      - series: 'godling_backup_last_success_timestamp_seconds{job="node", what="check"}'
        values: "0x40"
      - series: 'godling_backup_offsite{job="node"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 10h
        alertname: DatabaseBackupLate
        exp_alerts: []
      - eval_time: 10h
        alertname: RunBackupLate
        exp_alerts: []
      - eval_time: 10h
        alertname: BackupCheckLate
        exp_alerts: []
      - eval_time: 10h
        alertname: BackupsOnThisServer
        exp_alerts: []
      - eval_time: 10h
        alertname: BackupsNotReporting
        exp_alerts: []

  # Samples a minute apart or closer: a series is gone 5 minutes after its last sample, and an alert's `for` with it.
  - name: the database backup stops
    interval: 1m
    input_series:
      - series: 'godling_backup_started_timestamp_seconds{job="node"}'
        values: "0x360"
      - series: 'godling_backup_last_success_timestamp_seconds{job="node", what="db"}'
        values: "0x360" # once, at the start, and never again
    alert_rule_test:
      - eval_time: 3h
        alertname: DatabaseBackupLate
        exp_alerts: [] # 3 h is the limit
      - eval_time: 5h
        alertname: DatabaseBackupLate
        exp_alerts:
          - exp_labels: {severity: critical, job: node, what: db}
            exp_annotations:
              summary: "No database backup has finished well for 5h 0m 0s."
              description: It is taken every hour. Look at docker compose logs backup (the bucket, its keys, or the database).

  - name: no backup ever finishes, on this server
    interval: 1m
    input_series:
      - series: 'godling_backup_started_timestamp_seconds{job="node"}'
        values: "0x1200"
      - series: 'godling_backup_offsite{job="node"}'
        values: "0x1200"
    alert_rule_test:
      - eval_time: 2h
        alertname: BackupsOnThisServer
        exp_alerts:
          - exp_labels: {severity: warning, job: node}
            exp_annotations:
              summary: The backups are kept on this server only.
              description: A copy on the same disk does not survive losing the server. Set GODLING_BACKUP_REPOSITORY to a bucket (deploy/README.md, Backups).
      - eval_time: 4h
        alertname: DatabaseBackupLate
        exp_alerts:
          - exp_labels: {severity: critical, job: node}
            exp_annotations:
              summary: "No database backup has finished well for 4h 0m 0s."
              description: It is taken every hour. Look at docker compose logs backup (the bucket, its keys, or the database).
      - eval_time: 19h
        alertname: RunBackupLate
        exp_alerts:
          - exp_labels: {severity: warning, job: node}
            exp_annotations:
              summary: "No backup of the run has finished well for 19h 0m 0s."
              description: It is taken every six hours. Look at docker compose logs backup.

  - name: the weekly restore check fails
    interval: 4m
    input_series:
      - series: 'godling_backup_started_timestamp_seconds{job="node"}'
        values: "0x3300"
      - series: 'godling_backup_last_success_timestamp_seconds{job="node", what="check"}'
        values: "0x3300"
    alert_rule_test:
      - eval_time: 7d
        alertname: BackupCheckLate
        exp_alerts: []
      - eval_time: 9d
        alertname: BackupCheckLate
        exp_alerts:
          - exp_labels: {severity: warning, job: node, what: check}
            exp_annotations:
              summary: "The weekly restore check has not passed for 9d 0h 0m 0s."
              description: Reading the backups back, or restoring the newest database snapshot, fails. Run docker compose exec backup backup check to see why.

  - name: the backup service silent
    interval: 15m
    input_series:
      - series: 'up{job="node"}'
        values: "1x6"
    alert_rule_test:
      - eval_time: 15m
        alertname: BackupsNotReporting
        exp_alerts: []
      - eval_time: 45m
        alertname: BackupsNotReporting
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: The backup service reports nothing.
              description: It is not running, or node-exporter cannot read what it writes. Look at docker compose ps backup node-exporter.
