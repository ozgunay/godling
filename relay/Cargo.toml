[package]
name = "godling-relay"
version = "0.1.0"
edition = "2021"
description = "The island's stream relay: one connection to the world, the same updates to every viewer (ADR-015)."
publish = false

[lib]
name = "godling_relay"
path = "src/lib.rs"

[[bin]]
name = "godling-relay"
path = "src/main.rs"

# The versions Clawblox builds with (patches/: axum 0.8, tokio 1.49, tokio-tungstenite 0.28), so the island image
# compiles one set of crates.
[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1.49", features = ["full"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = "2"

[profile.release]
opt-level = 3
