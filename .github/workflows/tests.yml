# Every test suite, with its coverage (TESTING.md): the mind and the tools, the site, the renderer and the viewer
# screen, the world script, and the stream relay.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Mind and tools (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install pytest coverage zstandard
      - name: Test
        run: python -m coverage run -m pytest
      - name: Coverage
        run: python -m coverage report

  site:
    name: Site (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web/requirements.txt
      - name: Install
        run: python -m pip install -r requirements.txt coverage
      - name: Test
        run: python -m coverage run --source=. --omit='*/migrations/*,*/tests.py,*/test_*.py,manage.py' manage.py test
      - name: Coverage
        run: python -m coverage report --skip-empty

  renderer:
    name: Renderer and viewer screen (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: world/renderer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: world/renderer/package-lock.json
      - name: Install
        run: npm ci
      - name: Test, with coverage
        run: npm run coverage

  world:
    name: World script (Luau)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            world/tests/runner/target
          key: luau-runner-${{ runner.os }}-${{ hashFiles('world/tests/runner/Cargo.lock') }}
      - name: Build the test runner
        run: cargo build --release --locked --manifest-path world/tests/runner/Cargo.toml
      - name: Test, with coverage
        run: world/tests/runner/target/release/luau-test --lcov world-luau.lcov world/tests/test_*.luau

  relay:
    name: Stream relay (cargo test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            relay/target
          key: relay-${{ runner.os }}-${{ hashFiles('relay/Cargo.lock') }}
      - name: Install the coverage tools
        run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-llvm-cov
      - name: Test, with coverage
        run: cargo llvm-cov --locked --summary-only
