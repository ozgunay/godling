# Every test suite, with its coverage (TESTING.md): the mind and the tools, the site, the renderer and the viewer
# screen, and the world script.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Mind and tools (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install pytest coverage zstandard
      - name: Test
        run: python -m coverage run -m pytest
      - name: Coverage
        run: python -m coverage report

  site:
    name: Site (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web/requirements.txt
      - name: Install
        run: python -m pip install -r requirements.txt coverage
      - name: Test
        run: python -m coverage run --source=. --omit='*/migrations/*,*/tests.py,*/test_*.py,manage.py' manage.py test
      - name: Coverage
        run: python -m coverage report --skip-empty

  renderer:
    name: Renderer and viewer screen (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: world/renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: world/renderer/package-lock.json
      - name: Install
        run: npm ci
      - name: Test, with coverage
        run: npm run coverage

  world:
    name: World script (Luau)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            world/tests/runner/target
          key: luau-runner-${{ runner.os }}-${{ hashFiles('world/tests/runner/Cargo.lock') }}
      - name: Build the test runner
        run: cargo build --release --locked --manifest-path world/tests/runner/Cargo.toml
      - name: Test, with coverage
        run: world/tests/runner/target/release/luau-test --lcov world-luau.lcov world/tests/test_*.luau
